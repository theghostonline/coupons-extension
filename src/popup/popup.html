<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Promo Code Helper</title>

    <!-- Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Minimal‑modern, compact -->
    <style>
      :root {
        --accent: #6366f1; /* indigo‑500 */
        --accent-hover: #4f52e7; /* indigo‑600 */
        --text: #111;
        --muted: #666;
        --border: #d0d4da;
        --radius: 6px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font: inherit;
      }

      body {
        font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
        width: 280px; /* a bit slimmer */
        padding: 16px 14px 20px;
        color: var(--text);
        background: #fff;
      }

      h3 {
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 18px;
        text-align: center;
      }
      h3 i {
        margin-right: 6px;
        color: var(--accent);
      }

      /* ---------- BUTTONS ---------- */
      button {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 7px 8px;
        margin-bottom: 10px;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text);
        background: #f7f7f8;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button:hover {
        background: #eef0f3;
      }
      button i {
        font-size: 0.9rem;
        color: var(--accent);
      }

      /* Primary action */
      #start-automation {
        color: #fff !important;
        background: var(--accent);
        border: none;
        margin-top: 2px;
      }
      #start-automation:hover {
        background: var(--accent-hover);
      }

      /* ---------- INPUTS ---------- */
      label {
        display: block;
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 3px;
      }
      input[type="number"] {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 0.75rem;
        margin-bottom: 14px;
        background: #fff;
        color: var(--text);
      }
      input[type="number"]:focus {
        outline: none;
        border-color: var(--accent);
      }

      /* ---------- TOGGLE SWITCHES ---------- */
      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 0.75rem;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 32px;
        height: 18px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #cfd4da;
        border-radius: 34px;
        transition: 0.25s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 2px;
        bottom: 2px;
        background: #fff;
        border-radius: 50%;
        transition: 0.25s;
      }
      input:checked + .slider {
        background: var(--accent);
      }
      input:checked + .slider:before {
        transform: translateX(14px);
      }
    </style>
  </head>

  <body>
    <h3><i class="fas fa-tags"></i> Promo Codes Applier</h3>

    <!-- element selectors -->
    <button id="select-input">
      <i class="fas fa-i-cursor"></i> Input Field
    </button>
    <button id="select-apply-button">
      <i class="fas fa-hand-pointer"></i> Apply Button
    </button>
    <button id="select-price-field">
      <i class="fas fa-dollar-sign"></i> Price Field
    </button>
    <button id="select-remove-button">
      <i class="fas fa-backspace"></i> Remove Button
    </button>

    <!-- numeric settings -->
    <label for="interval">Interval (ms)</label>
    <input type="number" id="interval" value="1000" min="100" step="100" />

    <label for="apply-timeout">Timeout (ms)</label>
    <input type="number" id="apply-timeout" value="500" min="100" step="100" />

    <label for="length">Code Length</label>
    <input type="number" id="length" value="6" min="3" max="50" />

    <!-- toggles -->

    <div class="toggle-row">
      <span>Popular promo codes</span>
      <label class="switch">
        <input type="checkbox" id="use-popular-codes" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>Popular words</span>
      <label class="switch">
        <input type="checkbox" id="use-popular-words" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>Special chars</span>
      <label class="switch">
        <input type="checkbox" id="use-special-characters" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- start / stop -->
    <button id="start-automation">Start Automation</button>

    <script src="popup.js"></script>
  </body>
</html>
